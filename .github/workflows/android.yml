name: Android test build
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Camera permission (hand/racket mode)
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /><application#' android/app/src/main/AndroidManifest.xml
      - run: npm run assets -- --android || true
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: smash-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (easy download on the phone)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk smash.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test smash.apk --title "smash Android test" --notes "Test build. Download smash.apk and install." --prerelease
