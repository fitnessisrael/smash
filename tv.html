<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b08">
<title>סמש · מסך</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  body{padding:0;overflow:hidden}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:2.2vh 3vw;pointer-events:none}
  .brand h1{font-size:5vh}
  .score{display:flex;gap:2.4vw}
  .score div{text-align:center;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:1.6vh;padding:1vh 1.6vw;min-width:9vw}
  .score b{display:block;font-family:var(--f-num);font-size:5vh;line-height:1.1;color:var(--lime)}
  .score span{font-size:1.8vh;color:var(--muted)}
  .say{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:var(--f-display);font-size:11vh;color:var(--lime);text-shadow:0 0 30px rgba(0,0,0,.8);opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
  .say.on{opacity:1;transform:scale(1.04)}
  .say small{display:block;font-family:var(--f-body);font-size:3.6vh;color:var(--chalk)}
  .pair{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:5}
  .pair .box{display:flex;gap:6vw;align-items:center;padding:4vh 4vw}
  .pair h2{font-size:6vh}
  .pair p{font-size:2.6vh;color:var(--muted);margin:1.2vh 0}
  .pair .code{font-size:13vh;letter-spacing:2vw;width:auto;padding:1vh 3vw;margin-top:2vh}
  .qr{background:#fff;border-radius:2vh;padding:2vh;width:34vh;height:34vh}
  .qr svg{width:100%;height:100%}
  .live{position:fixed;bottom:2vh;left:3vw;font-size:2vh;color:var(--muted);pointer-events:none}
  .live i{display:inline-block;width:1.2vh;height:1.2vh;border-radius:50%;background:var(--bad);margin-inline-end:.6vw}
  .live.on i{background:var(--good)}
  @media (max-aspect-ratio:1/1){.pair .box{flex-direction:column;gap:3vh;text-align:center}.qr{width:28vh;height:28vh}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="brand"><svg class="ball" viewBox="0 0 34 34" style="width:5vh;height:5vh" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#d4ff1e"/><path d="M5 9c7 3 9 12 4 20M29 9c-7 3-9 12-4 20" stroke="#0a0b08" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><h1>סמש</h1></div>
  <div class="score"><div><b id="s-streak">0</b><span>רצף</span></div><div><b id="s-hits">0</b><span>נכנסו</span></div><div><b id="s-speed">—</b><span>קמ״ש</span></div></div>
</div>
<div class="say" id="say"></div>
<div class="live" id="live"><i></i><span id="live-t">ממתין לטלפון</span></div>

<div class="pair" id="pair">
  <div class="box">
    <div class="qr" id="qr"></div>
    <div>
      <h2>חבר את הטלפון</h2>
      <p>סרוק את הקוד עם הטלפון,<br>או פתח בטלפון את סמש, בחר "משחק מול מסך" והקלד:</p>
      <div class="code" id="code">····</div>
      <p id="pair-status">מכין חדר…</p>
      <button class="big" id="sound" style="margin-top:2vh;font-size:3vh">לחץ כאן להפעלת צליל</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/tv.js"></script>
</body>
</html>
